<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#42527A" opacity="0.30"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <!-- card background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" stroke="#243354" stroke-width="1"/>

  <g clip-path="url(#card)">
    <!-- ambient glows -->
    <circle cx="1010" cy="40" r="260" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="300" r="240" fill="url(#glowViolet)">
      <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- orbit system, right side -->
    <g transform="translate(985,160)">
      <circle r="66" stroke="#2B3C63" stroke-width="1" fill="none"/>
      <circle r="102" stroke="#27365A" stroke-width="1" fill="none" stroke-dasharray="3 6"/>
      <circle r="138" stroke="#223051" stroke-width="1" fill="none"/>
      <g>
        <circle cx="66" cy="0" r="5" fill="#36BCF7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="-102" cy="0" r="4" fill="#8B5CF6"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="138" r="3.5" fill="#EC4899"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      </g>
      <text x="0" y="14" text-anchor="middle" font-family="SF Mono, Consolas, Menlo, monospace" font-size="34" font-weight="600" fill="#4A5B85">&lt;/&gt;</text>
    </g>

    <!-- top-right annotation -->
    <text x="1156" y="46" text-anchor="end" font-family="SF Mono, Consolas, Menlo, monospace" font-size="14" fill="#5C6E96">// 4+ years of shipping</text>

    <!-- name -->
    <text x="82" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="4" fill="#F4F7FF">ZAIN <tspan fill="url(#accent)">ALI</tspan></text>

    <!-- animated accent underline -->
    <rect x="85" y="174" width="330" height="5" rx="2.5" fill="url(#accent)"/>
    <rect x="85" y="174" width="90" height="5" rx="2.5" fill="url(#sheen)">
      <animate attributeName="x" values="85;325;85" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- role line -->
    <text x="86" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#8FA1C7">SOFTWARE ENGINEER</text>
    <text x="86" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#5F7099">WEB PLATFORMS &#183; MOBILE APPS &#183; CLOUD &amp; DEVOPS</text>

    <!-- terminal hint with blinking cursor -->
    <text x="86" y="292" font-family="SF Mono, Consolas, Menlo, monospace" font-size="13" fill="#4E5F87">$ currently: next.js &#183; typescript &#183; node &#183; aws</text>
    <rect x="428" y="281" width="7" height="13" fill="#36BCF7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
